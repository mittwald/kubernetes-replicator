name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build and release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Log in to quay.io
        env:
          QUAY_IO_USER: ${{ secrets.QUAY_IO_USER }}
          QUAY_IO_TOKEN: ${{ secrets.QUAY_IO_TOKEN }}
        run: printf '%s' "${QUAY_IO_TOKEN}" | docker login -u "${QUAY_IO_USER}" --password-stdin quay.io

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@b953231f81b8dfd023c58e0854a721e35037f28b # v2.9.1
        with:
          version: "0.181.1"
          args: release --rm-dist
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_USER_TOKEN }}

  bump-version:
    name: Bump app version in Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Bump chart version
        uses: mittwald/bump-app-version-action@00f3d858e9a3092711e3d26ffb4c1d851096afb7 # v1
        with:
          mode: 'publish'
          chartYaml: './deploy/helm-chart/kubernetes-replicator/Chart.yaml'
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_USER_TOKEN }}"
          HELM_REPO_PASSWORD: "${{ secrets.HELM_REPO_PASSWORD }}"
