image:
  repository: quay.io/mittwald/kubernetes-replicator
  #tag: stable # if no tag is given, the chart's appVersion is used
  pullPolicy: Always
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
# CAUTION: grantClusterAdmin binds the replicator to the cluster-admin ClusterRole. Pushed Roles and RoleBindings can
# then grant any permission, so only allow trusted namespaces to push (see pushAllowedSourceNamespaces).
grantClusterAdmin: false
automountServiceAccountToken: true
# Regular expressions (each matching a complete namespace name) of namespaces whose objects may be pushed into all
# other namespaces with the "replicate-to" and "replicate-to-matching" annotations. Anyone who may create Secrets,
# ConfigMaps, ServiceAccounts, Roles or RoleBindings in such a namespace can write these objects into every
# namespace with the replicator's permissions, so only list namespaces that are controlled by cluster operators.
# Objects from other namespaces are only pushed into namespaces that accept them with the
# "replicator.v1.mittwald.de/allow-push-from" annotation (not supported for Roles and RoleBindings).
# Example:
# pushAllowedSourceNamespaces:
#   - platform
#   - cert-manager
pushAllowedSourceNamespaces: []
# args:
# - -resync-period=30m
# - -allow-all=false
# - -exclude-namespaces=kube-system
namespacesPrivileges:
  - get
  - watch
  - list
replicationEnabled:
  secrets: true
  configMaps: true
  roles: true
  roleBindings: true
  serviceAccounts: true
  privileges:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete 
  rolesPrivileges:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete 

## Deployment strategy / DaemonSet updateStrategy
##
updateStrategy: {}
#   type: RollingUpdate
#   rollingUpdate:
#     maxUnavailable: 1

serviceAccount:
  create: true
  annotations: {}
  name:
  privileges: []
  automountServiceAccountToken: true
  # - apiGroups: [""]
  #   resources: ["configmaps"]
# On OpenShift, set runAsUser and runAsGroup to null to let the security context constraints assign them.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

priorityClassName: ""

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# The number of old history to retain to allow rollback.
revisionHistoryLimit: 10

nodeSelector: {}

tolerations: []

affinity: {}

# Deployment annotations
annotations: {}

# Deployment labels
labels: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

# Enable vertical pod autoscaler
verticalPodAutoscaler:
  enabled: false

  # Recommender responsible for generating recommendation for the object.
  # List should be empty (then the default recommender will generate the recommendation)
  # or contain exactly one recommender.
  # recommenders:
  # - name: custom-recommender-performance

  # List of resources that the vertical pod autoscaler can control. Defaults to cpu and memory
  controlledResources: []
  # Specifies which resource values should be controlled: RequestsOnly or RequestsAndLimits.
  # controlledValues: RequestsAndLimits

  # Define the max allowed resources for the pod
  maxAllowed: {}
  # cpu: 100m
  # memory: 128Mi
  # Define the min allowed resources for the pod
  minAllowed: {}
  # cpu: 100m
  # memory: 128Mi

  updatePolicy:
    # Specifies minimal number of replicas which need to be alive for VPA Updater to attempt pod eviction
    # minReplicas: 1
    # Specifies whether recommended updates are applied when a Pod is started and whether recommended updates
    # are applied during the life of a Pod. Possible values are "Off", "Initial", "Recreate", and "Auto".
    updateMode: Auto
