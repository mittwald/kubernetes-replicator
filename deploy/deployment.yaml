apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicator-kubernetes-replicator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubernetes-replicator
    app.kubernetes.io/instance: replicator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-replicator
      app.kubernetes.io/instance: replicator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-replicator
        app.kubernetes.io/instance: replicator
    spec:
      serviceAccountName: replicator-kubernetes-replicator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kubernetes-replicator
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # pinned to a released version; update it when upgrading
        image: quay.io/mittwald/kubernetes-replicator:v2.12.4
        imagePullPolicy: IfNotPresent
        # To allow namespaces to push objects into all other namespaces ("replicate-to" / "replicate-to-matching"),
        # add for example:
        # - -push-allowed-source-namespaces=platform,cert-manager
        args: []
        ports:
        - name: health
          containerPort: 9102
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources: {}
